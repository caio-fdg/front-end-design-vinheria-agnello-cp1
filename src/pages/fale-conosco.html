<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vinheria Agnello - Fale Conosco</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="container">

  <header>
    <a href="../../index.html">
      <img id="logo" src="../assets/imgs/logo.png" alt="Logo da Vinheria Agnello">
    </a>

    <h1>Vinheria Agnello</h1>

    <nav class="menu">
      <a href="../../index.html">Início</a>
      <a href="./quem-somos.html">Quem Somos</a>
      <a href="./sobre-vinhos.html">Sobre Vinhos</a>
      <a href="./harmonizacao.html">Harmonização</a>
      <a href="./fale-conosco.html">Fale Conosco</a>
    </nav>
  </header>

  <main>
    <section>
      <img
        class="imagem-contato"
        src="../assets/imgs/banner-fale-conosco.png"
        alt="Entre em contato com a Vinheria Agnello"
      >
    </section>
    
    <section class="contato-introducao">
      <h2>Fale Conosco</h2>

      <p>
        Preencha o formulário abaixo e entraremos em contato.
      </p>
    </section>

    <section class="contato">
      <form class="formulario" action="#" method="post">

        <fieldset class="dados-pessoais">
          <legend>Dados Pessoais</legend>

          <label for="nome">Nome:</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome"
          >

          <label for="telefone">Telefone:</label>
          <input
            type="text"
            id="telefone"
            name="telefone"
            placeholder="(99) 9 9999-9999"
          >

          <label for="email">E-mail:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="email@email.com.br"
          >
        </fieldset>

        <div class="campo-mensagem">
          <label for="mensagem">Digite sua mensagem:</label>

          <textarea
            name="mensagem"
            id="mensagem"
            placeholder="Escreva sua mensagem..."
          ></textarea>
        </div>

        <button class="botao-enviar" type="submit">Enviar</button>

      </form>
    </section>
  </main>

  <footer>
    <p>Vinheria Agnello</p>
    <p>Todos os direitos reservados</p>
  </footer>

</body>

</html>
